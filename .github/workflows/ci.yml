name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies (locked)
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.lock
          .\.venv\Scripts\python.exe -m pip check
      - name: Mutation worker retirement regression
        run: node ../scripts/test-python.js tests/test_mutation_worker_cleanup.py tests/test_kernel_runtime.py::test_kernel_launcher_is_owned_before_interpreter_starts -q
      - name: Isolated backend regression suite
        # Print each test name before it runs. A blocked Windows worker used to
        # leave only the last completed -q percentage, obscuring the hold point.
        # Dump all Python thread stacks if one test runs for over five minutes.
        run: node ../scripts/test-python.js tests -vv -o faulthandler_timeout=300

  frontend-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install Python dependencies for frontend composition tests
        run: |
          python -m venv backend/.venv
          .\backend\.venv\Scripts\python.exe -m pip install -r backend/requirements.lock
          .\backend\.venv\Scripts\python.exe -m pip check
      - name: Frontend build, typecheck, and regression suite
        run: npm run test:frontend

  backend-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies (requirements.txt)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check
      - name: Install CJK fonts for PDF artifact tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Isolated backend regression suite
        id: backend_linux_pytest
        run: node ../scripts/test-python.js
      - name: Posix PTY + unsupported desktop smoke
        if: ${{ always() && !cancelled() }}
        working-directory: .
        run: backend/.venv/bin/python scripts/ci-linux-smoke.py
      - name: Install pinned cua-driver
        if: ${{ always() && !cancelled() }}
        working-directory: .
        run: node scripts/install-cua-driver.js
      - name: X11 libraries for a real cua-driver session
        if: ${{ always() && !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils xterm xfonts-base libx11-6 libxtst6 libxext6 libxcb1 \
            dbus-x11 at-spi2-core
      - name: cua-driver list, focus, and observe
        if: ${{ always() && !cancelled() }}
        working-directory: .
        run: |
          eval "$(dbus-launch --sh-syntax)"
          xvfb-run -a backend/.venv/bin/python scripts/ci-linux-desktop.py

  macos-package:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install npm dependencies
        run: npm ci
      - name: Backend setup, including pinned cua-driver
        run: npm run setup:backend
      - name: Pinned cua-driver is installed
        run: |
          test -x bin/cua-driver/cua-driver
          grep -qx 0.28.2 bin/cua-driver/VERSION
          file bin/cua-driver/cua-driver
      - name: Prepare native llama-server
        run: npm run prepare:native
      - name: llama-server runs
        run: bin/llama-server --version
      # These three steps were missing here while linux-package had them. The
      # app packaged without a Deck bundle and without a frozen backend, so
      # macos-qualify launched an app that could never reach a connected
      # workbench: "Timed out waiting for connected workbench".
      - name: Build the main deck
        run: npm run build:deck
      - name: Build the frozen backend
        run: npm run build:backend
      - name: Check native runtime inputs
        run: node scripts/check-native-runtime.js
      - name: Unsigned dmg and zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never
      - name: Package artifacts exist
        run: |
          ls -lh dist
          find dist -name '*.dmg' -o -name '*.zip' | grep -q .
      - name: Frozen backend is in the packaged app
        run: |
          set -eu
          # The frozen backend has to be inside the bundle, not just built on
          # the runner, or the packaged app has no way to start a backend.
          app="$(find dist -name '*.app' -maxdepth 3 -print -quit)"
          test -n "$app"
          find "$app/Contents/Resources" -name 'Variant1Backend*' -print -quit | grep -q .
      - name: Upload macOS packages
        uses: actions/upload-artifact@v6
        with:
          name: macos-packages
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install npm dependencies
        run: npm ci
      - name: Backend setup, including pinned cua-driver
        run: npm run setup:backend
      - name: Pinned cua-driver is installed
        run: |
          test -x bin/cua-driver/cua-driver
          grep -qx 0.28.2 bin/cua-driver/VERSION
      - name: Prepare native llama-server
        run: npm run prepare:native
      - name: llama-server runs
        run: bin/llama-server --version
      - name: Build the main deck
        run: npm run build:deck
      - name: Build the frozen backend
        run: npm run build:backend
      - name: Check native runtime inputs
        run: node scripts/check-native-runtime.js
      - name: Unsigned AppImage and deb
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux --publish never
      - name: Package artifacts exist
        run: |
          ls -lh dist
          find dist -name '*.AppImage' | grep -q .
          find dist -name '*.deb' | grep -q .
      - name: AppImage carries a runnable payload
        run: |
          set -eu
          # This job installs no display libraries, so the image cannot be
          # launched here. An earlier version tried anyway and died with exit
          # 127 on a missing shared library. Assert what is provable without a
          # GUI instead: the AppImage is executable, it extracts, and the
          # extracted image contains a launcher and a desktop entry. The real
          # launch is a separate step in linux-qualify, which installs the
          # display libraries and xvfb.
          appimage="$(find dist -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          abs="$(cd "$(dirname "$appimage")" && pwd)/$(basename "$appimage")"
          work="$(mktemp -d)"
          ( cd "$work" && APPIMAGE_EXTRACT_AND_RUN=1 "$abs" --appimage-extract >/dev/null )
          root="$work/squashfs-root"
          test -d "$root"
          test -n "$(find "$root" -maxdepth 1 -type f -perm -u+x -print -quit)"
          test -n "$(find "$root" -maxdepth 1 -name '*.desktop' -print -quit)"
          echo "AppImage extracts to a launcher and a desktop entry"
      - name: Upload Linux packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  linux-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: linux-package
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Download built Linux packages
        uses: actions/download-artifact@v7
        with:
          name: linux-packages
          path: dist
      - name: Install the deb on the runner host
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
      - name: Installed payload is complete
        run: |
          # electron-builder derives the deb package name and the installed
          # executable from package.json "name" (variant1), not productName
          # (VARIANT-1). Assert the names the package actually produces.
          test -x /opt/VARIANT-1/variant1
          /opt/VARIANT-1/resources/bin/llama-server --version
          test -x /opt/VARIANT-1/resources/bin/cua-driver/cua-driver
          test "$(cat /opt/VARIANT-1/resources/bin/cua-driver/VERSION)" = "0.28.2"
      - name: Display server libraries for Electron
        run: |
          # libasound2 is a virtual package on Ubuntu 24.04 (noble) after the
          # 64-bit time_t transition; the real package is libasound2t64.
          # Asking for the old name aborts the job with
          # "E: Package 'libasound2' has no installation candidate" before any
          # display assertion runs. libasound2t64 has provided it since 24.04.
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils libgtk-3-0 libnotify4 libnss3 libxss1 \
            libxtst6 libxrandr2 libasound2t64 libatspi2.0-0 libsecret-1-0
      - name: Packaged Main Deck smoke (installed binary, Xvfb)
        env:
          VARIANT1_E2E_EXECUTABLE: /opt/VARIANT-1/variant1
          VARIANT1_E2E_CDP_PORT: "9341"
        run: xvfb-run -a node scripts/test-deck-electron-smoke.js
      # The AppImage cannot be driven by test-deck-electron-smoke.js, which
      # spawns an executable path, whereas an AppImage has to be launched
      # through its own runtime. Launch it here instead and assert it comes up
      # and serves a debugging endpoint. This is the step that needs the
      # display libraries installed above, which is why the packaging job
      # cannot do it.
      - name: AppImage starts and serves CDP (Xvfb)
        run: |
          set -eu
          appimage="$(find dist -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          # upload-artifact zips the payload, so the exec bit electron-builder
          # set is gone by the time download-artifact lays it down here:
          # "Permission denied" from xvfb-run. linux-package checks test -x
          # before uploading, where the bit is still set, so it cannot catch
          # this. Restore it and assert it so a regression fails loudly.
          chmod +x "$appimage"
          test -x "$appimage"
          abs="$(cd "$(dirname "$appimage")" && pwd)/$(basename "$appimage")"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$abs" --remote-debugging-port=9343 >/tmp/appimage.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=""
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:9343/json/version >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::AppImage did not publish a CDP endpoint"
            tail -40 /tmp/appimage.log || true
            exit 1
          fi
          echo "AppImage launched and published a CDP endpoint"
      - name: Uninstall removes the payload
        if: ${{ always() }}
        run: |
          # Purge rather than remove so packaged conffiles cannot survive, and
          # never mask the package name: `apt-get remove -y variant-1 || true`
          # silently matched nothing and left the whole payload in place.
          if ! sudo apt-get purge -y variant1; then
            echo "::error::apt-get purge variant1 failed - wrong package name?"
          fi
          if [ -e /opt/VARIANT-1 ]; then
            echo "::error::uninstall left /opt/VARIANT-1 behind"
            ls -la /opt/VARIANT-1 || true
            exit 1
          fi

  macos-qualify:
    runs-on: macos-latest
    timeout-minutes: 45
    needs: macos-package
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Download built macOS packages
        uses: actions/download-artifact@v7
        with:
          name: macos-packages
          path: dist
      # The macOS counterpart of the Linux qualification bar: unpack the shipped
      # artifact, prove the payload is complete and runnable, exercise the
      # packaged Main Deck, then remove the app and prove nothing is left.
      #
      # The bundle and its executable are DISCOVERED, never hardcoded. The Linux
      # job failed twice because it assumed names electron-builder derives from
      # package.json; the same trap applies to the .app payload, and the exact
      # spelling cannot be confirmed from a Windows host.
      - name: Unpack the app bundle
        run: |
          set -eu
          # find -print -quit, not `find | head -1`: under pipefail the early
          # close gives find a SIGPIPE and fails the step.
          zip="$(find dist -name '*.zip' -print -quit)"
          test -n "$zip"
          mkdir -p unpacked
          ditto -x -k "$zip" unpacked
          app="$(find unpacked -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          exe="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          test -n "$exe"
          test -x "$exe"
          printf 'APP=%s\nEXE=%s\n' "$app" "$exe" >> "$GITHUB_ENV"
          echo "app=$app"
          echo "exe=$exe"
      - name: Installed payload is complete
        run: |
          set -eu
          test -x "$EXE"
          test -x "$APP/Contents/Resources/bin/llama-server"
          "$APP/Contents/Resources/bin/llama-server" --version
          test -x "$APP/Contents/Resources/bin/cua-driver/cua-driver"
          test "$(cat "$APP/Contents/Resources/bin/cua-driver/VERSION")" = "0.28.2"
      - name: Packaged Main Deck smoke (unpacked app)
        env:
          VARIANT1_E2E_EXECUTABLE: ${{ env.EXE }}
          VARIANT1_E2E_CDP_PORT: "9342"
        run: node scripts/test-deck-electron-smoke.js
      - name: Removal leaves nothing behind
        if: ${{ always() }}
        run: |
          set -eu
          rm -rf "$APP"
          if [ -e "$APP" ]; then
            echo "::error::removal left $APP behind"
            exit 1
          fi
          echo "removed $APP"

  # The Windows installer had been produced and checked by hand, so no run in this
  # workflow ever built it. That is why the 0.1.1-preview.1 release shipped three
  # platforms from three different commits: Linux and macOS were rebuilt here
  # while Windows was not rebuilt at all. A version bump is only meaningful if all
  # three come out of the same tree, so Windows is packaged and qualified here on
  # the same bar as the other two.
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install npm dependencies
        run: npm ci
      - name: Backend setup, including pinned cua-driver
        run: npm run setup:backend
      - name: Pinned cua-driver is installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path bin\cua-driver\cua-driver.exe)) { throw 'cua-driver.exe missing' }
          if ((Get-Content bin\cua-driver\VERSION -Raw).Trim() -ne '0.28.2') { throw 'unexpected cua-driver VERSION' }
      - name: Prepare native llama-server
        run: npm run prepare:native
      - name: llama-server runs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & bin\llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server exited $LASTEXITCODE" }
      - name: Build the main deck
        run: npm run build:deck
      - name: Build the frozen backend
        run: npm run build:backend
      - name: Check native runtime inputs
        run: node scripts/check-native-runtime.js
      - name: Unsigned NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --publish never
      - name: Package artifacts exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem dist | Format-Table Name, Length
          $setup = Get-ChildItem dist -Filter *.exe
          if (-not $setup) { throw 'no installer produced in dist' }
      - name: Frozen backend is in the packaged payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The frozen backend has to be inside the installed payload, not merely
          # built on the runner, or the packaged app cannot start a backend. The
          # macOS job shipped an .app without it and the Deck smoke could never
          # reach a connected workbench.
          $payload = Get-ChildItem dist -Recurse -Filter 'Variant1Backend*' -ErrorAction SilentlyContinue
          if (-not $payload) { throw 'Variant1Backend not found in the packaged payload' }
          $payload | ForEach-Object { Write-Host "frozen backend: $($_.FullName)" }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: windows-packages
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  windows-qualify:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: windows-package
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Download built Windows installer
        uses: actions/download-artifact@v7
        with:
          name: windows-packages
          path: dist
      # Every path here is DISCOVERED, never hardcoded. The Linux qualification
      # job failed twice by assuming names electron-builder derives from
      # package.json, and the same trap applies to the NSIS payload.
      - name: Silent install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist -Filter *.exe | Select-Object -First 1).FullName
          if (-not $setup) { throw 'no installer in dist' }
          $target = Join-Path $env:RUNNER_TEMP 'variant1-install'
          # NSIS silent install. /D must be last and unquoted.
          $proc = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$target" -Wait -PassThru
          Write-Host "installer exit: $($proc.ExitCode)"
          # An NSIS installer re-launches itself as a child, so -Wait can return
          # before the payload is fully written. Poll instead of trusting it.
          $deadline = (Get-Date).AddSeconds(180)
          $app = $null
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $target) {
              $app = Get-ChildItem $target -Filter *.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notlike 'Uninstall*' } |
                Select-Object -First 1
              if ($app) { break }
            }
            Start-Sleep -Seconds 3
          }
          if (-not $app) { throw "silent install never produced an application executable under $target" }
          "INSTALL=$target" >> $env:GITHUB_ENV
          "APPEXE=$($app.FullName)" >> $env:GITHUB_ENV
          Write-Host "app: $($app.FullName)"
      - name: Installed payload is complete
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:APPEXE)) { throw "missing $env:APPEXE" }
          $bin = Join-Path (Split-Path $env:APPEXE -Parent) 'resources\bin'
          $llama = Get-ChildItem $bin -Filter 'llama-server.exe' -ErrorAction SilentlyContinue
          if (-not $llama) { throw "llama-server.exe missing under $bin" }
          & $llama.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server exited $LASTEXITCODE" }
          $cua = Join-Path $bin 'cua-driver\cua-driver.exe'
          if (-not (Test-Path $cua)) { throw "cua-driver.exe missing under $bin" }
          if ((Get-Content (Join-Path $bin 'cua-driver\VERSION') -Raw).Trim() -ne '0.28.2') { throw 'unexpected cua-driver VERSION' }
          $frozen = Get-ChildItem (Split-Path $env:APPEXE -Parent) -Recurse -Filter 'Variant1Backend*' -ErrorAction SilentlyContinue
          if (-not $frozen) { throw 'frozen backend missing from the installed payload' }
      - name: Packaged Main Deck smoke (installed binary)
        env:
          VARIANT1_E2E_EXECUTABLE: ${{ env.APPEXE }}
          VARIANT1_E2E_CDP_PORT: "9344"
        run: node scripts/test-deck-electron-smoke.js
      - name: Uninstall removes the payload
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not $env:INSTALL) { Write-Host 'nothing installed'; exit 0 }
          $uninstaller = Get-ChildItem $env:INSTALL -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($uninstaller) {
            $proc = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host "uninstaller exit: $($proc.ExitCode)"
          } else {
            Write-Host '::warning::no uninstaller found; removing the directory directly'
            Remove-Item -Recurse -Force $env:INSTALL -ErrorAction SilentlyContinue
          }
          if (Test-Path $env:INSTALL) {
            Write-Host "::error::uninstall left $($env:INSTALL) behind"
            Get-ChildItem $env:INSTALL | Format-Table Name
            exit 1
          }
          Write-Host "removed $($env:INSTALL)"
