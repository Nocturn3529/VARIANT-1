name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies (locked)
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.lock
          .\.venv\Scripts\python.exe -m pip check
      - name: Isolated backend regression suite
        run: node ../scripts/test-python.js

  frontend-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install Python dependencies for frontend composition tests
        run: |
          python -m venv backend/.venv
          .\backend\.venv\Scripts\python.exe -m pip install -r backend/requirements.lock
          .\backend\.venv\Scripts\python.exe -m pip check
      - name: Frontend build, typecheck, and regression suite
        run: npm run test:frontend

  backend-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies (requirements.txt)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check
      - name: Install CJK fonts for PDF artifact tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Isolated backend regression suite
        id: backend_linux_pytest
        run: node ../scripts/test-python.js
      - name: Posix PTY + unsupported desktop smoke
        if: ${{ always() && !cancelled() }}
        working-directory: .
        run: backend/.venv/bin/python scripts/ci-linux-smoke.py
