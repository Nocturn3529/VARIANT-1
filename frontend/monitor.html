<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' variant1:; connect-src 'none'; style-src 'self' 'unsafe-inline' variant1:; font-src 'self' variant1:; script-src 'self' variant1:; img-src 'self' variant1: data:;" />
  <title>VARIANT-1 — Logs</title>
  <link rel="stylesheet" href="variant1://app/frontend/monitor.css" />
</head>
<body>
  <div class="mon">
    <header class="mon-chrome" id="bar">
      <span id="live-dot" class="live-dot" title="Streaming the session log" aria-hidden="true"></span>
      <strong class="mon-chrome__title">Log monitor</strong>
      <small class="mon-chrome__sub">main0.log · this session</small>
      <span class="mon-chrome__spacer"></span>
      <button type="button" id="mon-pin" class="mon-chrome__button" title="Keep window on top" aria-label="Keep Log monitor on top" aria-pressed="true">Pin</button>
      <button type="button" id="mon-minimize" class="mon-chrome__button is-icon" title="Minimize" aria-label="Minimize Log monitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" id="mon-maximize" class="mon-chrome__button is-icon" title="Maximize or restore" aria-label="Maximize or restore Log monitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5Z"/></svg></button>
      <button type="button" id="mon-close" class="mon-chrome__button is-icon is-close" title="Close" aria-label="Close Log monitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>

    <div class="mon-toolbar" role="toolbar" aria-label="Log tools">
      <label class="mon-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13Zm5-1 4.5 4.5"/></svg>
        <input id="filter" type="search" placeholder="Filter lines" autocomplete="off" spellcheck="false" aria-label="Filter log lines" />
      </label>
      <div class="mon-levels" role="group" aria-label="Show">
        <button type="button" data-level="all" aria-pressed="true">All</button>
        <button type="button" data-level="error" aria-pressed="false">Errors <span id="count-error">0</span></button>
        <button type="button" data-level="warn" aria-pressed="false">Warnings <span id="count-warn">0</span></button>
        <button type="button" data-level="activity" aria-pressed="false">Activity <span id="count-activity">0</span></button>
      </div>
      <span class="mon-toolbar__spacer"></span>
      <button type="button" id="btn-wrap" class="mon-tool" aria-pressed="true" title="Wrap long lines">Wrap</button>
      <button type="button" id="btn-copy" class="mon-tool" title="Copy all lines">Copy</button>
      <button type="button" id="btn-clear" class="mon-tool" title="Clear this session's log view">Clear</button>
      <button type="button" id="btn-folder" class="mon-tool" title="Open the logs folder">Folder</button>
    </div>

    <main id="feed" class="mon-feed is-wrapped" aria-live="polite" aria-label="Session log">
      <div id="empty" class="mon-empty">
        <strong>Waiting for log lines<span class="caret">_</span></strong>
        <p>The same stream as <code>logs/main0.log</code>: backend, renderer, activity mirrors and the main process.</p>
      </div>
      <p id="no-match" class="mon-empty is-filtered" hidden>No lines match this filter.</p>
    </main>

    <button type="button" id="resume-btn" class="mon-resume" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg><span id="new-count">0</span> new lines
    </button>

    <footer class="mon-footer">
      <span><span id="line-count">0</span> lines</span>
      <span class="mon-footer__dot" aria-hidden="true">·</span>
      <span>Auto-scroll <span id="scroll-state">on</span></span>
      <span id="copy-status" class="mon-footer__status" role="status" hidden></span>
      <span class="mon-footer__spacer"></span>
      <span class="mon-footer__faint">Session only · main1.log keeps filtered diagnostics · Read-only</span>
      <span id="clock" class="mon-footer__clock">00:00:00</span>
    </footer>
  </div>

  <script src="variant1://app/frontend/monitor.js"></script>
</body>
</html>
